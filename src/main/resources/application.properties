# Application
spring.application.name=ai-interview-prep
server.port=${PORT:8080}
# Groq API Configuration - Updated Model
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.1-8b-instant
groq.temperature=0.7
groq.max-tokens=2048

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080,https://interview-prepai-pro.vercel.app
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*

# Logging
logging.level.com.interviewprep=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n